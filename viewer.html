<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Viewer Karakter - WebGL</title>
  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#7f9a96; transition:background .3s; }
    canvas { display:block; width:100vw; height:100vh; cursor:grab; }
    canvas:active { cursor:grabbing; }
    #bar { position:fixed; left:12px; top:10px; display:flex; gap:10px; align-items:center; font:600 14px sans-serif; color:#10242a; }
    #bar select { font:600 14px sans-serif; padding:4px 8px; border-radius:6px; border:1px solid #0003; }
    #hint { position:fixed; left:12px; bottom:10px; color:#10242acc; font:12px sans-serif; pointer-events:none; }
  </style>
</head>
<body>
  <canvas id="glcanvas" width="960" height="540"></canvas>
  <div id="bar">Karakter: <select id="pick"></select></div>
  <div id="hint">Drag: putar · Shift/klik kanan + drag: geser · Scroll: zoom · 1 depan · 2 samping · 3 belakang · 4 atas · R: putar otomatis · B: ganti latar · klik 2x: reset</div>
  <script type="module" src="viewer.js"></script>
</body>
</html>
